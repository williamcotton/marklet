name: Desktop CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-2025
            arch: x64
            asset: Marklet-windows-x64.exe
          - platform: macOS Apple Silicon
            runner: macos-15
            arch: arm64
            asset: Marklet-mac-arm64.dmg
          - platform: macOS Intel
            runner: macos-15-intel
            arch: x64
            asset: Marklet-mac-x64.dmg
          - platform: Linux x64
            runner: ubuntu-24.04
            arch: x64
            asset: Marklet-linux-x86_64.AppImage

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify release version
        if: github.ref_type == 'tag'
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) throw new Error('Tag must match the package version')"
      - name: Package Marklet
        run: npm run build:desktop -- --${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: installers
          merge-multiple: true
      - name: Publish desktop downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          for file in Marklet-windows-x64.exe Marklet-mac-arm64.dmg Marklet-mac-x64.dmg Marklet-linux-x86_64.AppImage; do
            test -s "installers/$file"
          done
          gh release create "$GITHUB_REF_NAME" \
            installers/Marklet-windows-x64.exe \
            installers/Marklet-mac-arm64.dmg \
            installers/Marklet-mac-x64.dmg \
            installers/Marklet-linux-x86_64.AppImage \
            --title "Marklet $GITHUB_REF_NAME" --verify-tag --generate-notes --latest
